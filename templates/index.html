<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeagueBoss</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0d; --surface: #161616; --card: #1e1e1e; --border: #2a2a2a;
    --accent: #c8f000; --accent2: #00c8a0; --text: #f0f0f0; --muted: #666;
    --danger: #ff4444; --win: #c8f000; --draw: #f0a500; --loss: #ff4444;
  }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  .app-header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 2rem; display: flex; align-items: center; justify-content: space-between;
    height: 64px; position: sticky; top: 0; z-index: 100;
  }
  .app-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 3px; color: var(--accent); }
  .app-logo span { color: var(--text); }
  .header-actions { display: flex; gap: 0.75rem; }

  .layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 64px); }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem; overflow-y: auto; }
  .main { padding: 2rem; overflow-y: auto; }

  .stream-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 2rem; }
  .stream-tab {
    padding: 0.5rem 1.25rem; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card); color: var(--muted); cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500; transition: all 0.15s;
  }
  .stream-tab:hover { border-color: var(--accent); color: var(--text); }
  .stream-tab.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }

  .section-label { font-family: 'Bebas Neue', sans-serif; font-size: 0.9rem; letter-spacing: 3px; color: var(--muted); margin-bottom: 1rem; margin-top: 1.5rem; }
  .section-label:first-child { margin-top: 0; }

  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-size: 0.75rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 0.4rem; }
  .form-group input, .form-group select {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 0.6rem 0.75rem; border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.15s;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
  .form-group select option { background: var(--card); }

  .score-row { display: grid; grid-template-columns: 1fr 40px 1fr; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
  .score-sep { text-align: center; color: var(--muted); font-weight: 600; }

  .btn {
    padding: 0.65rem 1.25rem; border-radius: 8px; border: none; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.875rem;
    transition: all 0.15s; display: inline-flex; align-items: center; gap: 0.4rem;
  }
  .btn-primary { background: var(--accent); color: #000; width: 100%; justify-content: center; margin-top: 0.5rem; }
  .btn-primary:hover { background: #d4ff00; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 0.3rem 0.6rem; font-size: 0.75rem; }
  .btn-danger:hover { background: var(--danger); color: white; }
  .btn-export { background: var(--accent2); color: #000; }
  .btn-export:hover { background: #00e0b4; }

  .standing-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 2rem; }
  .standing-header { padding: 1.25rem 1.5rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .standing-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 2px; }
  .standing-meta { font-size: 0.8rem; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; }
  thead th { padding: 0.75rem 1rem; text-align: left; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 500; }
  thead th.num { text-align: center; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody tr:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.04); }
  tbody td { padding: 0.85rem 1rem; font-size: 0.9rem; }
  tbody td.num { text-align: center; color: var(--muted); }
  tbody td.pts { text-align: center; font-weight: 700; color: var(--accent); font-size: 1rem; }
  tbody td.team-name { font-weight: 500; }

  .pos-badge { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; background: var(--border); color: var(--muted); }
  .pos-1 { background: #ffd700; color: #000; }
  .pos-2 { background: #c0c0c0; color: #000; }
  .pos-3 { background: #cd7f32; color: #000; }

  .form-pills { display: flex; gap: 3px; }
  .form-pill { width: 18px; height: 18px; border-radius: 50%; font-size: 0.6rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .form-pill.W { background: var(--win); color: #000; }
  .form-pill.D { background: var(--draw); color: #000; }
  .form-pill.L { background: var(--loss); color: #fff; }

  .result-item {
    display: grid; grid-template-columns: 1fr auto 1fr auto;
    align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 0.5rem; font-size: 0.875rem;
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .result-score { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.25rem 0.75rem; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 2px; color: var(--accent); text-align: center; min-width: 60px; }
  .result-home { text-align: right; font-weight: 500; }
  .result-away { text-align: left; font-weight: 500; }

  .team-tag { display: inline-flex; align-items: center; gap: 0.4rem; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 0.3rem 0.75rem; font-size: 0.8rem; margin: 0.25rem; }
  .team-tag button { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.75rem; }

  .empty-state { text-align: center; padding: 3rem 2rem; color: var(--muted); }
  .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }

  .setup-panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .divider { height: 1px; background: var(--border); margin: 1rem 0; }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:200; display:flex; align-items:center; justify-content:center; }
  .modal-box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:2rem; width:340px; }
  .modal-title { font-family:'Bebas Neue',sans-serif; font-size:1.6rem; letter-spacing:2px; margin-bottom:0.5rem; }
  .modal-sub { color:var(--muted); font-size:0.85rem; margin-bottom:1.5rem; }
  .modal-input { width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:0.75rem 1rem; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:1rem; outline:none; margin-bottom:1rem; }
  .modal-input:focus { border-color:var(--accent); }
  .modal-error { color:var(--danger); font-size:0.85rem; margin-bottom:0.75rem; display:none; }
  .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--accent); color: #000; padding: 0.75rem 1.25rem; border-radius: 10px; font-weight: 600; font-size: 0.875rem; z-index: 999; animation: toastIn 0.3s ease, toastOut 0.3s ease 2.2s forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(20px); } }

  #tab-setup { display: none; }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-logo">League<span>Boss</span></div>
  <div class="header-actions">
    <button id="login-btn" class="btn btn-secondary" onclick="showLoginModal()">🔒 Admin</button>
    <button id="logout-btn" class="btn btn-secondary" onclick="doLogout()" style="display:none">🔓 Logout</button>
    <button class="btn btn-secondary" onclick="showTab('setup')" id="manage-btn" style="display:none">⚙ Manage</button>
    <button class="btn btn-secondary" onclick="showTab('standings')">⚽ Standings</button>
    <label class="btn btn-secondary" style="cursor:pointer;" title="Import results from Excel">
      ↑ Import Excel
      <input type="file" id="import-file" accept=".xlsx" style="display:none" onchange="importExcel(this)">
    </label>
    <a href="/api/export" class="btn btn-export">↓ Export Excel</a>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="section-label">Log Result</div>
    <div class="form-group">
      <label>Stream</label>
      <select id="result-stream" onchange="populateTeamDropdowns()"></select>
    </div>
    <div class="form-group">
      <label>Match Date</label>
      <input type="date" id="result-date">
    </div>
    <div class="form-group">
      <label>Home Team</label>
      <select id="result-home"></select>
    </div>
    <div class="form-group">
      <label>Home Goals</label>
      <input type="number" id="score-home" min="0" placeholder="0" style="text-align:center; font-size:1.4rem; font-weight:700; color:var(--accent);">
    </div>
    <div class="form-group">
      <label>Away Goals</label>
      <input type="number" id="score-away" min="0" placeholder="0" style="text-align:center; font-size:1.4rem; font-weight:700;">
    </div>
    <div class="form-group">
      <label>Away Team</label>
      <select id="result-away"></select>
    </div>
    <button class="btn btn-primary" onclick="logResult()">+ Log Result</button>

    <div class="divider"></div>
    <div class="section-label">Recent Results</div>
    <div id="recent-results"></div>
  </aside>

  <main class="main">
    <div id="tab-standings">
      <div class="stream-tabs" id="stream-tabs"></div>
      <div id="standings-content"></div>
    </div>
    <div id="tab-setup">
      <div class="setup-panel">
        <div class="section-label" style="margin-top:0">Add New Stream</div>
        <div style="display:flex; gap:0.75rem;">
          <input type="text" id="new-stream-name" placeholder="e.g. Stream A"
            style="flex:1; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:0.6rem 0.75rem; border-radius:8px; font-family:'DM Sans',sans-serif; outline:none;"
            onkeydown="if(event.key==='Enter') addStream()">
          <button class="btn btn-secondary" onclick="addStream()">Add</button>
        </div>
      </div>
      <div id="stream-setup-list"></div>
    </div>
  </main>
</div>

<script>
let appData = { streams: [], results: [] };
let activeStream = null;

async function api(method, url, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  return res.json();
}

async function loadData() {
  await checkAuth();
  appData = await api('GET', '/api/data');
  if (appData.streams.length > 0 && !activeStream) {
    activeStream = appData.streams[0].id;
  }
  render();
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function showTab(tab) {
  document.getElementById('tab-standings').style.display = tab === 'standings' ? 'block' : 'none';
  document.getElementById('tab-setup').style.display = tab === 'setup' ? 'block' : 'none';
  if (tab === 'setup') renderSetup();
}

async function addStream() {
  const name = document.getElementById('new-stream-name').value.trim();
  if (!name) return;
  await api('POST', '/api/stream', { name });
  document.getElementById('new-stream-name').value = '';
  await loadData();
  renderSetup();
  toast(`Stream "${name}" added`);
}

async function deleteStream(id) {
  if (!confirm('Delete this stream and all its results?')) return;
  await api('DELETE', `/api/stream/${id}`);
  if (activeStream === id) activeStream = appData.streams[0]?.id || null;
  await loadData();
  renderSetup();
}

async function addTeam(streamId) {
  const input = document.getElementById(`team-input-${streamId}`);
  const name = input.value.trim();
  if (!name) return;
  const res = await api('POST', '/api/team', { streamId, name });
  if (res.error) { toast(res.error); return; }
  input.value = '';
  await loadData();
  renderSetup();
  toast(`"${name}" added`);
}

async function removeTeam(streamId, teamName) {
  await api('DELETE', '/api/team', { streamId, name: teamName });
  await loadData();
  renderSetup();
}

async function logResult() {
  const streamId = document.getElementById('result-stream').value;
  const date     = document.getElementById('result-date').value;
  const home     = document.getElementById('result-home').value;
  const away     = document.getElementById('result-away').value;
  const gh       = document.getElementById('score-home').value;
  const ga       = document.getElementById('score-away').value;

  if (!streamId || !home || !away || gh === '' || ga === '') {
    toast('Please fill in all fields'); return;
  }
  if (home === away) { toast('Home and Away must be different'); return; }

  await api('POST', '/api/result', { streamId, date, home, away, gh, ga });
  document.getElementById('score-home').value = '';
  document.getElementById('score-away').value = '';
  await loadData();
  toast(`Result logged: ${home} ${gh}–${ga} ${away}`);
}

async function deleteResult(id) {
  await api('DELETE', `/api/result/${id}`);
  await loadData();
}

function switchStream(id) {
  activeStream = id;
  renderStandings();
  renderStreamTabs();
  renderRecentResults();
}

function render() {
  renderStreamTabs();
  populateStreamDropdown();
  populateTeamDropdowns();
  renderStandings();
  renderRecentResults();
}

function renderStreamTabs() {
  const container = document.getElementById('stream-tabs');
  container.innerHTML = appData.streams.map(s =>
    `<button class="stream-tab ${s.id === activeStream ? 'active' : ''}" onclick="switchStream('${s.id}')">${s.name}</button>`
  ).join('');
}

async function renderStandings() {
  const container = document.getElementById('standings-content');
  if (!activeStream || appData.streams.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">⚽</div><p>No streams yet. Go to Manage to add streams and teams.</p></div>`;
    return;
  }
  const stream = appData.streams.find(s => s.id === activeStream);
  if (!stream || stream.teams.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">👥</div><p>No teams in this stream yet. Go to Manage to add teams.</p></div>`;
    return;
  }

  const standings = await api('GET', `/api/standings/${activeStream}`);
  const streamResults = appData.results.filter(r => r.streamId === activeStream);

  let html = `
    <div class="standing-card">
      <div class="standing-header">
        <div>
          <div class="standing-title">${stream.name}</div>
          <div class="standing-meta">${stream.teams.length} teams · ${streamResults.length} matches played</div>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:40px">#</th>
            <th>Team</th>
            <th class="num">P</th><th class="num">W</th><th class="num">D</th><th class="num">L</th>
            <th class="num">GF</th><th class="num">GA</th><th class="num">GD</th><th class="num">PTS</th>
            <th>Form</th>
          </tr>
        </thead>
        <tbody>`;

  standings.forEach((row, i) => {
    const pos = i + 1;
    const badge = pos <= 3 ? `pos-${pos}` : '';
    const last5 = row.form.slice(-5).map(f => `<div class="form-pill ${f}">${f}</div>`).join('');
    html += `
      <tr>
        <td><span class="pos-badge ${badge}">${pos}</span></td>
        <td class="team-name">${row.team}</td>
        <td class="num">${row.p}</td><td class="num">${row.w}</td>
        <td class="num">${row.d}</td><td class="num">${row.l}</td>
        <td class="num">${row.gf}</td><td class="num">${row.ga}</td>
        <td class="num" style="color:${row.gd > 0 ? 'var(--win)' : row.gd < 0 ? 'var(--loss)' : 'var(--muted)'}">${row.gd > 0 ? '+' : ''}${row.gd}</td>
        <td class="pts">${row.pts}</td>
        <td><div class="form-pills">${last5}</div></td>
      </tr>`;
  });
  html += `</tbody></table></div>`;
  container.innerHTML = html;
}

function renderRecentResults() {
  const container = document.getElementById('recent-results');
  const recent = [...appData.results]
    .filter(r => !activeStream || r.streamId === activeStream)
    .sort((a, b) => b.date.localeCompare(a.date))
    .slice(0, 8);

  if (recent.length === 0) {
    container.innerHTML = `<div style="color:var(--muted); font-size:0.85rem; text-align:center; padding:1rem;">No results yet</div>`;
    return;
  }
  container.innerHTML = recent.map(r => `
    <div class="result-item">
      <div class="result-home">${r.home}</div>
      <div class="result-score">${r.gh}–${r.ga}</div>
      <div class="result-away">${r.away}</div>
      <button class="btn btn-danger" onclick="deleteResult('${r.id}')">✕</button>
    </div>`).join('');
}

function populateStreamDropdown() {
  const sel = document.getElementById('result-stream');
  sel.innerHTML = appData.streams.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  if (activeStream) sel.value = activeStream;
}

function populateTeamDropdowns() {
  const streamId = document.getElementById('result-stream').value;
  const stream = appData.streams.find(s => s.id === streamId);
  const teams = stream ? stream.teams : [];
  const opts = teams.map(t => `<option value="${t}">${t}</option>`).join('');
  document.getElementById('result-home').innerHTML = opts;
  document.getElementById('result-away').innerHTML = opts;
}

function renderSetup() {
  const container = document.getElementById('stream-setup-list');
  if (!container) return;
  if (appData.streams.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">⚙️</div><p>Add your first stream above</p></div>`;
    return;
  }
  container.innerHTML = appData.streams.map(stream => `
    <div class="setup-panel">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
        <div style="font-family:'Bebas Neue',sans-serif; font-size:1.2rem; letter-spacing:2px;">${stream.name}</div>
        <button class="btn btn-danger" onclick="deleteStream('${stream.id}')">Delete Stream</button>
      </div>
      <div style="display:flex; gap:0.5rem; margin-bottom:0.75rem;">
        <input type="text" id="team-input-${stream.id}" placeholder="Team name"
          style="flex:1; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:0.6rem 0.75rem; border-radius:8px; font-family:'DM Sans',sans-serif; outline:none;"
          onkeydown="if(event.key==='Enter') addTeam('${stream.id}')">
        <button class="btn btn-secondary" onclick="addTeam('${stream.id}')">Add Team</button>
      </div>
      <div>
        ${stream.teams.length === 0
          ? `<span style="color:var(--muted); font-size:0.85rem;">No teams yet</span>`
          : stream.teams.map(t => `
            <span class="team-tag">
              ${t}
              <button onclick="removeTeam('${stream.id}', '${t.replace(/'/g, "\\'")}')">✕</button>
            </span>`).join('')}
      </div>
    </div>`).join('');
}

async function importExcel(input) {
  const file = input.files[0];
  if (!file) return;
  
  const formData = new FormData();
  formData.append('file', file);
  
  toast('Importing... please wait');
  
  try {
    const res = await fetch('/api/import', { method: 'POST', body: formData });
    const data = await res.json();
    
    if (data.error) {
      alert('Import failed: ' + data.error);
      return;
    }
    
    await loadData();
    toast(`✅ Imported ${data.imported} results across ${data.streams} streams!`);
    input.value = '';
  } catch (e) {
    alert('Import failed: ' + e.message);
  }
}

// ── AUTH ──────────────────────────────────────────────────────────────────────
let isAdmin = false;

async function checkAuth() {
  const res = await api('GET', '/api/me');
  isAdmin = res.admin;
  updateAuthUI();
}

function updateAuthUI() {
  document.getElementById('login-btn').style.display = isAdmin ? 'none' : 'inline-flex';
  document.getElementById('logout-btn').style.display = isAdmin ? 'inline-flex' : 'none';
  document.getElementById('manage-btn').style.display = isAdmin ? 'inline-flex' : 'none';
  document.querySelector('.sidebar').style.display = isAdmin ? 'block' : 'none';
}

function showLoginModal() {
  document.getElementById('login-modal').style.display = 'flex';
  document.getElementById('admin-password').value = '';
  document.getElementById('login-error').style.display = 'none';
  setTimeout(() => document.getElementById('admin-password').focus(), 100);
}

function hideLoginModal() {
  document.getElementById('login-modal').style.display = 'none';
}

async function doLogin() {
  const password = document.getElementById('admin-password').value;
  const res = await api('POST', '/api/login', { password });
  if (res.ok) {
    isAdmin = true;
    hideLoginModal();
    updateAuthUI();
    toast('Welcome back, Admin!');
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

async function doLogout() {
  await api('POST', '/api/logout');
  isAdmin = false;
  updateAuthUI();
  showTab('standings');
  toast('Logged out');
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.getElementById('result-date').value = new Date().toISOString().split('T')[0];
loadData();
</script>
